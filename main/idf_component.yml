dependencies:
  espressif/cjson: ^1.7.19~1
  espressif/esp_lcd_axs15231b: ==1.0.0
  espressif/esp_io_expander_tca95xx_16bit: ^2.0.0
  espressif/w5500:
    version: ^1.0.1
    rules:
    - if: target in ["esp32s3"]
  espressif/usb:
    version: ^1.0.1
    rules:
    - if: target in ["esp32s3"]
  espressif/usb_host_hid:
    version: ^1.0.4
    rules:
    - if: target in ["esp32s3"]
  espressif/esp_tinyusb:
    version: ^2.1.0
    rules:
    - if: target in ["esp32s3"]
  espressif/elf_loader:
    version: ^1.3.1
    rules:
    - if: target in ["esp32", "esp32s2", "esp32s3", "esp32c6", "esp32c61", "esp32p4", "esp32c5"]
  espressif/esp_hosted:
    version: ^2.11.0
    rules:
    - if: target in ["esp32p4"]
  espressif/esp_wifi_remote:
    version: ^1.6.4
    rules:
    - if: target in ["esp32p4"]
  espressif/esp_lcd_ek79007:
    version: ^1.0.2
    rules:
    - if: target in ["esp32p4"]
  espressif/esp_lcd_ili9881c:
    version: ^1.0.0
    rules:
    - if: target in ["esp32p4"]
  espressif/esp_lcd_touch_st7123:
    version: ^1.0.1
    rules:
    - if: target in ["esp32p4"]
  espressif/esp_lcd_touch_gt911:
    version: ^1.1.3
    rules:
    - if: target in ["esp32p4"]
  espressif/usb_host_cdc_acm:
    # CDC-ACM host for the external ESP32-C5 (JanOS) on the Tab5 USB-A port.
    # The espressif/usb host stack is already pulled in on P4 (via esp_video's
    # UVC path); this adds the CDC-ACM class driver on top of it.
    version: ^2.0.0
    rules:
    - if: target in ["esp32p4"]
  espressif/esp_video:
    # Keep the matching IPA release below: newer IDF 6 IPA archives contain
    # Zba/Zbb/Zbs instructions unsupported by the original CrowPanel P4 silicon.
    version: ==2.3.0
    rules:
    - if: target in ["esp32p4"]
  espressif/esp_ipa:
    version: ==2.2.0~1
    rules:
    - if: target in ["esp32p4"]
